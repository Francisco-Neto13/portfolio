# Production on the VPS. The reverse proxy reaches this service as portfolio:3000 through the
# "borda" network.
#   docker compose -f docker-compose.prod.yml up -d --build --wait
# Never publish a port here: Docker bypasses ufw for published ports.
name: portfolio-prod

services:
  portfolio:
    build: .
    image: portfolio-app
    restart: unless-stopped
    # No write access, no Linux capabilities and a memory ceiling: the site needs none of them
    read_only: true
    # The server runs as node (uid 1000): a root-owned cache made every image request optimize
    # the image again, and those optimizations together ran the container out of memory.
    # The tmpfs counts against mem_limit, hence the size cap
    tmpfs:
      - /app/.next/cache:uid=1000,gid=1000,mode=0755,size=128m
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Room for image optimization (sharp) on top of the server; the VPS is shared, see
    # /srv/REGRAS-DA-VPS.md
    mem_limit: 768m
    networks:
      - borda
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6

networks:
  borda:
    external: true
